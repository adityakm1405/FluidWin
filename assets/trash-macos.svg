<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    
    <filter id="binShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    
    <linearGradient id="bodyHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFD3D8" />
      <stop offset="14%" stop-color="#ECEEF1" />
      <stop offset="35%" stop-color="#F7F8FA" />
      <stop offset="72%" stop-color="#F2F4F7" />
      <stop offset="90%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D6DAE0" />
    </linearGradient>

    
    <linearGradient id="bodyVertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="78%" stop-color="#E4E7EC" stop-opacity="0.15" />
      <stop offset="93%" stop-color="#C8CDD5" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#9FA6B2" stop-opacity="0.75" />
    </linearGradient>

    
    <radialGradient id="frostedGlow" cx="38%" cy="78%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="interiorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4D8DE" />
      <stop offset="18%" stop-color="#E7E9ED" />
      <stop offset="50%" stop-color="#F0F1F4" />
      <stop offset="82%" stop-color="#E3E6EB" />
      <stop offset="100%" stop-color="#CDD2D9" />
