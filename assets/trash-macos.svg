      C 37,25 78,16 128,16
      C 178,16 219,25 219,39
      L 200,213
      C 198,231 167,242 128,242
      C 89,242 58,231 56,213
      Z" fill="url(#bodyVertical)" />

    
    <path d="
      M 37,39
      C 37,25 78,16 128,16
      C 178,16 219,25 219,39
      L 200,213
      C 198,231 167,242 128,242
      C 89,242 58,231 56,213
      Z" fill="url(#frostedGlow)" />

    
    <ellipse cx="128" cy="39" rx="89.5" ry="21.5" fill="url(#interiorGrad)" />
    <ellipse cx="128" cy="39" rx="89.5" ry="21.5" fill="url(#interiorDepth)" />

    
    <ellipse cx="128" cy="39" rx="90.5" ry="22.2" fill="none" stroke="url(#rimStroke)" stroke-width="2.2" />

    
    <path d="M 38.5,39 C 38.5,27 78.5,18 128,18 C 177.5,18 217.5,27 217.5,39" fill="none" stroke="#B0B6BF" stroke-width="0.75" opacity="0.65" />

    
    <path d="M 37.5,39.5 C 37.5,52 78,61.5 128,61.5 C 178,61.5 218.5,52 218.5,39.5" fill="none" stroke="#C5CAD3" stroke-width="0.8" opacity="0.5" />
