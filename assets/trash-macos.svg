  <g filter="url(#binShadow)">
    
    <path id="binSilhouette" d="
      M 37,39
      C 37,25 78,16 128,16
      C 178,16 219,25 219,39
      L 200,213
      C 198,231 167,242 128,242
      C 89,242 58,231 56,213
