name: Windows build

on:
  push:
    branches:
      - feature/shared-appearance-controls
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build FluidWin
        shell: pwsh
        run: ./compila.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FluidWin-Windows
          path: FluidWin.exe
          if-no-files-found: error
