name: Windows build

on:
  push:
    branches:
      - feature/shared-appearance-controls
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MinGW UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build FluidWin
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./compila.ps1 -msys "$env:MSYS2_LOCATION"

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/assets -Force | Out-Null
          Copy-Item FluidWin.exe release/FluidWin.exe
          Copy-Item assets/* release/assets/

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FluidWin-Windows
          path: release
          if-no-files-found: error
